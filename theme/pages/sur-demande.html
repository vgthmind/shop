<style>

  opacity:0;animation:vgd-pop .38s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 55ms);transition:transform .15s ease,border-color .15s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent}
