  function paint(extra) {
    var all = NOT_UNIQUE.concat(extra || []);
    var isNotUnique = all.some(function (slug) { return window.location.pathname.indexOf(slug) !== -1; });
    if (isNotUnique) return;
    var price = document.querySelector('.product-subheader');
    var images = document.querySelector('.product-images');
    if ((!price && !images) || document.querySelector('.unique-badge')) return;
    var badge = document.createElement('span');
    badge.className = 'unique-badge';
    badge.textContent = 'Unique piece';
    if (images) {
      images.appendChild(badge);
      var reposition = function () {
        var containerRect = images.getBoundingClientRect();
        var imgs = images.querySelectorAll('img.product-image');
        var img = null, imgRect = null;
        for (var ii = 0; ii < imgs.length; ii++) {
          var r = imgs[ii].getBoundingClientRect();
          if (r.width > 0 && Math.abs(r.left - containerRect.left) < 3) { img = imgs[ii]; imgRect = r; break; }
        }
        if (!img) return;
        var left = (imgRect.left - containerRect.left) + 14;
        var top = (imgRect.top - containerRect.top) + 14;
        badge.style.setProperty('left', left + 'px', 'important');
        badge.style.setProperty('top', top + 'px', 'important');
      };
      reposition();
      window.addEventListener('resize', reposition);
      images.querySelectorAll('img').forEach(function (im) { im.addEventListener('load', reposition); });
      new MutationObserver(function (muts) {
        for (var mi = 0; mi < muts.length; mi++) {
          if (muts[mi].target === badge || badge.contains(muts[mi].target)) continue;
          requestAnimationFrame(reposition);
          return;
        }
      }).observe(images, { attributes: true, childList: true, subtree: true });
    } else if (price) {
      price.insertAdjacentElement('afterend', badge);
    }
  }
  (window.__vgConfig || Promise.resolve({})).then(function (cfg) {
    var extra = [];
    for (var slug in cfg) { if (cfg[slug] && cfg[slug].unique_mode === 'force-no') extra.push(slug); }
    paint(extra);
  });
})();
</script>

<script>
(function () {
  var hero = document.querySelector('.welcome_image');
  if (!hero) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduce) {
    var canvas = document.createElement('canvas');
    canvas.className = 'vg-embers';
    hero.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = hero.offsetWidth;
      canvas.height = hero.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    var particles = [];
    var COUNT = 36;
    for (var i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.5 + 0.15,
        drift: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.5 + 0.3
      });
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function (p) {
        p.y -= p.speed;
        p.x += p.drift;
        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,150,60,' + p.alpha + ')';
        ctx.shadowColor = 'rgba(255,120,40,0.8)';
        ctx.shadowBlur = 4;
        ctx.fill();
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  var img = hero.querySelector('img');
  if (img && !reduce && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    hero.addEventListener('mousemove', function (e) {
      var rect = hero.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width - 0.5;
      var y = (e.clientY - rect.top) / rect.height - 0.5;
      img.style.transform = 'scale(1.05) translate(' + (x * -14) + 'px,' + (y * -10) + 'px)';
    });
    hero.addEventListener('mouseleave', function () {
      img.style.transform = '';
    });
  }
})();
</script>

   principale x1,3 qui tournoie selon la vitesse de la souris puis ralentit
   en douceur, s'etire dans le sens du mouvement, scintille au repos ;
   trainee plus vivante (derive vers le haut, taille qui oscille, extinction
   en scintillant, petites etoiles qui tournoient). UNE seule boucle
   requestAnimationFrame, transform/opacity uniquement, rien sur tactile ;

      last = now;

        streak.style.opacity = Math.min(dist / 35, 0.85);
      } else {
        streak.style.opacity = 0;
      }

    }

  }
  requestAnimationFrame(loop);
})();

<script>
(function () {
  if (!/^\/cart\/?$/.test(window.location.pathname)) return;

    for (var slug in cfg) { if (cfg[slug] && cfg[slug].unique_mode === 'force-no') EXTRA_EXCLUDED.push(slug); }

  });
  function lockUniqueQty() {
    var items = document.querySelectorAll('li.cart-item');
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item.getAttribute('data-vg-qty-locked')) continue;

      var m = link.getAttribute('href').match(/\/product\/([^\/?#]+)/);

      if (!slug || NOT_UNIQUE.concat(EXTRA_EXCLUDED).indexOf(slug) !== -1) continue;
      var qtyInput = item.querySelector('.product-quantity');
      var incBtn = item.querySelector('.qty-button--increase');
      var decBtn = item.querySelector('.qty-button--decrease');
      if (!qtyInput) continue;
      item.setAttribute('data-vg-qty-locked', '1');

    var usedImages = {};

      if (!chosen) chosen = entry.images[0];
      usedImages[chosen] = true;

<script>
(function () {
  function setCursorHidden(on) {
    document.documentElement.classList.toggle('vg-lightbox-open', on);
  }
  function openLightbox(images, startIndex) {
    var idx = startIndex;
    var overlay = document.createElement('div');
    overlay.className = 'vg-lightbox';
    var backdrop = document.createElement('div');
    backdrop.className = 'vg-lightbox-backdrop';
    var shadowImg = document.createElement('img');
    shadowImg.className = 'vg-lightbox-img vg-lightbox-shadow';
    var img = document.createElement('img');
    img.className = 'vg-lightbox-img';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'vg-lightbox-close';
    closeBtn.setAttribute('aria-label', 'Fermer');
    closeBtn.textContent = String.fromCharCode(215);
    var prevBtn = null, nextBtn = null;
    if (images.length > 1) {
      prevBtn = document.createElement('button');
      prevBtn.type = 'button';
      prevBtn.className = 'vg-lightbox-nav vg-lightbox-prev';
      prevBtn.setAttribute('aria-label', 'Precedent');
      prevBtn.textContent = String.fromCharCode(8249);
      nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.className = 'vg-lightbox-nav vg-lightbox-next';
      nextBtn.setAttribute('aria-label', 'Suivant');
      nextBtn.textContent = String.fromCharCode(8250);
    }
    function render() { img.src = images[idx]; shadowImg.src = images[idx]; backdrop.style.backgroundImage = "url('" + images[idx] + "')"; }
    function close() {
      overlay.remove();
      setCursorHidden(false);
      document.removeEventListener('keydown', onKey);
    }
    function go(delta) {
      idx = (idx + delta + images.length) % images.length;
      render();
    }
    function onKey(ev) {
      if (ev.key === 'Escape') close();
      else if (ev.key === 'ArrowLeft' && prevBtn) go(-1);
      else if (ev.key === 'ArrowRight' && nextBtn) go(1);
    }
    closeBtn.addEventListener('click', close);
    if (prevBtn) prevBtn.addEventListener('click', function (e) { e.stopPropagation(); go(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function (e) { e.stopPropagation(); go(1); });
    overlay.addEventListener('click', function (ev) { if (ev.target === overlay) close(); });
    document.addEventListener('keydown', onKey);
    overlay.appendChild(backdrop);
    overlay.appendChild(shadowImg);
    overlay.appendChild(img);
    if (prevBtn) overlay.appendChild(prevBtn);
    if (nextBtn) overlay.appendChild(nextBtn);
    overlay.appendChild(closeBtn);
    render();
    setCursorHidden(true);
    document.body.appendChild(overlay);
  }
  document.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('a.gallery-link, a.zoom-image-container') : null;
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href) return;
    e.preventDefault();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    var group = link.closest('.product-images, .product-list-image-container') || document;
    var anchors = group.querySelectorAll ? group.querySelectorAll('a.gallery-link, a.zoom-image-container') : [];
    var seen = {};
    var images = [];
    for (var i = 0; i < anchors.length; i++) {
      var h = anchors[i].getAttribute('href');
      if (h && !seen[h]) { seen[h] = true; images.push(h); }
    }
    if (!images.length) images = [href];
    var startIndex = images.indexOf(href);
    if (startIndex === -1) startIndex = 0;
    openLightbox(images, startIndex);
  }, true);
})();
</script>
