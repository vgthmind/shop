<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <title>vgthmind — pièces</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #f4f2ec; color: #171717; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
    .vg-page { padding-bottom: 110px; }
    .muted { color: var(--muted); font-size: 13px; }
    input[type=text], input[type=search], input[type=number], input[type=datetime-local], select, textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: inherit; color: inherit; min-height: 44px; }
    textarea { resize: vertical; }
    .head-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .alert { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: rgba(201,116,26,.12); border: 1px solid rgba(201,116,26,.45); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
    .alert a, .alert button { color: var(--ink); font-weight: 600; background: none; border: 0; text-decoration: underline; cursor: pointer; font: inherit; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .tools .search { flex: 1 1 200px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 500 12px/1 var(--f-mono); letter-spacing: .04em; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .card { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
    .card.changed { box-shadow: 0 0 0 2px #ffe27a; }
    .card .ph { position: relative; display: block; aspect-ratio: 4 / 5; background: #ebe8e0; border: 0; padding: 0; width: 100%; cursor: pointer; }
    .card .ph img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .card.off .ph img { opacity: .55; }
    .badges { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; pointer-events: none; }
    .badges .vg-pill { font-size: 10px; padding: 3px 8px; }
    .vg-pill.uni { background: #171717; }
    .card .meta { padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 2px; }
    .card .meta b { font: 700 14px/1.2 var(--f-title); letter-spacing: .03em; text-transform: uppercase; overflow-wrap: anywhere; }
    .card .meta span { font-size: 13px; color: var(--muted); }
    .card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 8px 10px 12px; }
    .step { display: inline-flex; align-items: center; gap: 2px; }
    .step button, .mini { min-width: 40px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: 500 15px/1 var(--f-mono); cursor: pointer; color: var(--ink); }
    .step output { min-width: 26px; text-align: center; font: 500 13px/1 var(--f-mono); }
    .acts { display: none; flex-direction: column; gap: 6px; padding: 0 12px 12px; }
    .card.open .acts { display: flex; }
    .acts .vg-btn { min-height: 40px; width: 100%; }
    .reorder { display: flex; gap: 6px; padding: 0 12px 12px; }
    .reorder .mini { flex: 1; }
    .empty { text-align: center; padding: 40px 10px; }
    /* fiche */
    .fhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .fhead h1 { margin: 0; font-size: 24px; flex: 1 1 200px; overflow-wrap: anywhere; }
    .sect { margin-bottom: 12px; }
    .sect h2 { margin: 0 0 10px; }
    .fl { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    .fl:first-of-type { margin-top: 0; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .ph1 { position: relative; border: 1px solid var(--line); border-radius: 14px; background: #ebe8e0; overflow: hidden; }
    .ph1 img { width: 100%; aspect-ratio: 4 / 5; object-fit: contain; display: block; }
    .ph1 .tag1 { position: absolute; left: 6px; top: 6px; }
    .ph1 .ctl { display: flex; justify-content: space-between; gap: 2px; padding: 4px; background: #fff; }
    .ph1 .ctl button { flex: 1; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-size: 15px; }
    .ph1 .ctl button.del { color: var(--st-bad); }
    .ph1 .ctl button:disabled { opacity: .35; cursor: default; }
    .cats { display: flex; gap: 8px; flex-wrap: wrap; }
    .cats label, .colors label { display: inline-flex; gap: 8px; align-items: center; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; font-size: 14px; }
    .cats input, .colors input { width: 18px; height: 18px; accent-color: #171717; }
    .colors { display: flex; gap: 8px; flex-wrap: wrap; }
    .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); display: inline-block; }
    .chk { display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 15px; }
    .chk input { width: 20px; height: 20px; accent-color: #171717; flex: none; }
    table.ports { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
    table.ports td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .gain { color: var(--st-done); } .perte { color: var(--st-bad); }
    .note { padding: 10px 14px; border-radius: 12px; background: rgba(255,226,122,.35); border: 1px solid rgba(0,0,0,.1); font-size: 14px; margin-top: 10px; }
    .note.err { background: rgba(162,59,42,.12); }
    details.adv summary { cursor: pointer; font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
    .bar2 { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #171717; color: #fff; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .bar2 .vg-btn { background: #fff; color: #171717; border-color: #fff; min-width: 140px; }
    .bar2 .vg-btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); min-width: 0; }
    .bar2 .vg-btn:disabled { opacity: .5; }
    .bar2 span { font-size: 14px; }
    #msg { min-height: 1.4em; margin: 12px 2px; }
    @media (max-width: 759px) {
      .bar2 { bottom: calc(62px + env(safe-area-inset-bottom)); padding-bottom: 10px; }
      .bar2 .vg-btn { flex: 1; }
      .bar2 .vg-btn.ghost { flex: 0 0 auto; min-width: 100px; }
      .bar2 span { flex: 1 1 100%; text-align: center; font-size: 13px; }
      .vg-page { padding-bottom: 200px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .two { grid-template-columns: 1fr; }
      .head-acts .vg-btn.big { flex: 1; }
    }
  </style>

<body>
<main class="vg-page">
  <div class="vg-card" id="login">
    <p>Connecte-toi avec GitHub pour voir et modifier tes pièces.</p>
    <button type="button" class="vg-btn" id="login-btn">Se connecter avec GitHub</button>
  </div>

  <div id="app" hidden>
    <!-- LISTE -->
    <section id="v-list">
      <div class="vg-head">
        <div><h1>Pièces</h1><p class="vg-sub" id="count"></p></div>
        <div class="head-acts">
          <button type="button" class="vg-btn ghost" id="reorder">Réordonner</button>
          <button type="button" class="vg-btn ghost" id="refresh">Actualiser</button>
          <a class="vg-btn big" href="#/new">+ Nouvelle pièce</a>
        </div>
      </div>
      <div class="alert" id="alert-w" hidden><span id="alert-w-t"></span><button type="button" id="alert-w-b">Voir ces pièces</button></div>
      <div class="tools">
        <input type="search" class="search" id="filter" placeholder="Chercher une pièce…" aria-label="Chercher une pièce">
        <div class="chips" id="chips"></div>
      </div>
      <div class="grid" id="grid"></div>
      <p class="muted" style="margin-top:16px">Autres outils : <a href="studio-photo.html">Studio photo (détourage, assistant « Nouvelle pièce »)</a> · <a href="pieces.html">Poids et ports, tableau de toutes les pièces</a> · <a href="stock.html">Stock en tableau et sauvegardes</a> · <a href="index.html">Éditeur technique (Sveltia)</a></p>
    </section>

    <!-- FICHE -->
    <section id="v-fiche" hidden></section>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
</main>

<div class="bar2" id="bar-list" hidden><span id="bar-list-t"></span><button type="button" class="vg-btn ghost" id="list-cancel">Annuler</button><button type="button" class="vg-btn" id="list-save">Enregistrer</button></div>
<div class="bar2" id="bar-fiche" hidden><span id="bar-fiche-t"></span><button type="button" class="vg-btn ghost" id="fiche-cancel">Annuler</button><button type="button" class="vg-btn" id="fiche-save">Enregistrer</button></div>

<script src="catalogue-core.js"></script>
<script src="pieces-view.js"></script>
<script src="piece-form.js"></script>
<script src="shipping-calc.js"></script>
<script src="fiche-core.js"></script>
<script src="fiche-save.js"></script>
<script src="pieces-save.js"></script>
<script src="studio-webp.js"></script>
<script src="video-convert.js"></script>
<script src="photo-encode.js"></script>
<script src="img-retry.js"></script>
<script src="studio-publish.js"></script>
<script src="vg-admin-auth.js"></script>
<script src="vg-admin-ui.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var C = window.VGCatalogue, F = window.VGFiche, FS = window.VGFicheSave, PV = window.VGPieces, PF = window.VGPieceForm;
  var pieces = [], stock = null, categories = [], config = null, listChanges = {}, stockEdits = {}, products = null;
  var localImg = {}; // adresse d'une photo enregistrée dans cette session -> aperçu local (la photo n'est en ligne qu'après la reconstruction)
  var filter = 'all', reorder = false, cur = null, dirty = false, openCard = null, uniqueTouched = false;
  var FILTERS = [['all', 'Toutes'], ['live', 'En ligne'], ['preview', 'Masquées'], ['scheduled', 'Programmées'], ['soldout', 'Épuisées'], ['noweight', 'Sans poids'], ['archived', 'Archivées']];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function say(t, err) { $('msg').textContent = t || ''; $('msg').style.color = err ? '#a23b2a' : ''; }
  function eur(n) { return (Math.round(n * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function fmtParis(iso) { try { return new Date(iso).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } }
  function parisInput(iso) { // ISO UTC -> « AAAA-MM-JJTHH:MM » à l'heure de Paris
    if (!iso) return '';
    var o = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(iso)).forEach(function (x) { o[x.type] = x.value; });
    return o.year + '-' + o.month + '-' + o.day + 'T' + (o.hour === '24' ? '00' : o.hour) + ':' + o.minute;
  }
  function gh() { return window.VGStudioPublish.api; }
  function merged() { var m = {}; pieces.forEach(function (p) { m[p.slug] = p; }); Object.keys(listChanges).forEach(function (s) { m[s] = listChanges[s]; }); return Object.keys(m).map(function (s) { return m[s]; }); }
  function byslug(s) { return merged().filter(function (p) { return p.slug === s; })[0]; }
  function thumb(u, size) {
    if (!u) return '';
    var sized = '../assets/products-sized/' + (size || 320) + '/' + u.replace(/^\/?assets\/products\//, '').replace(/\.\w+$/, '.webp');
    if (localImg[u]) return '<img alt="" src="' + esc(localImg[u]) + '">'; // photo tout juste enregistrée : pas encore en ligne, on garde l'aperçu local
    return '<img alt="" loading="lazy" src="' + esc(sized) + '" data-sized="' + esc(sized) + '" data-full="' + esc('..' + u) + '" onerror="vgImgRetry(this)">';
  }
  function stockOf(p) { // stock réel (Worker) si connu, sinon quantité de départ de la fiche
    if (p.slug in stockEdits) return stockEdits[p.slug];
    if (stock && stock[p.slug]) return stock[p.slug].stock;
    var q = Number(p.quantity); return isFinite(q) ? q : (p.in_stock === false ? 0 : 1);
  }
  function workerReady() { return window.vgAdminToken() ? Promise.resolve() : window.vgAdminLogin(); }

  // ---------- LISTE ----------
  function chips() {
    $('chips').innerHTML = FILTERS.map(function (f) { return '<button type="button" class="chip" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>'; }).join('');
  }
  function matchFilter(p, st) {
    if (filter === 'all') return true;
    if (filter === 'live') return st === 'live' || st === 'coming';
    if (filter === 'soldout') return st !== 'archived' && stockOf(p) <= 0;
    if (filter === 'noweight') return st !== 'archived' && !PV.weightOf(p);
    return st === filter;
  }
  function badges(p, st) {
    var b = [];
    if (st !== 'archived' && stockOf(p) <= 0) b.push('<span class="vg-pill bad">Épuisée</span>');
    if (st === 'preview') b.push('<span class="vg-pill">Masquée</span>');
    if (st === 'scheduled') b.push('<span class="vg-pill plan">Programmée · ' + esc(fmtParis(p.publish_at)) + '</span>');
    if (st === 'coming') b.push('<span class="vg-pill todo">Bientôt disponible</span>');
    if (st === 'archived') b.push('<span class="vg-pill">Archivée</span>');
    if (st !== 'archived' && !PV.weightOf(p)) b.push('<span class="vg-pill todo">Sans poids</span>');
    if (p.unique !== false && st !== 'archived') b.push('<span class="vg-pill uni">Pièce unique</span>');
    return b.join('');
  }
  function drawList() {
    var q = $('filter').value.trim().toLowerCase(), all = C.sorted(merged());
    var list = all.filter(function (p) {
      return matchFilter(p, C.state(p)) && (!q || p.slug.toLowerCase().indexOf(q) !== -1 || String(p.name || '').toLowerCase().indexOf(q) !== -1);
    });
    $('count').textContent = all.filter(function (p) { return !p.archived; }).length + ' pièces' + (all.some(function (p) { return p.archived; }) ? ' · ' + all.filter(function (p) { return p.archived; }).length + ' archivée(s)' : '');
    var nw = all.filter(function (p) { return !p.archived && !PV.weightOf(p); }).length;
    $('alert-w').hidden = !nw; $('alert-w-t').textContent = nw + ' pièce' + (nw > 1 ? 's' : '') + ' sans poids : les frais de port ne peuvent pas être calculés.';
    $('reorder').textContent = reorder ? 'Terminer' : 'Réordonner';
    chips();
    $('grid').innerHTML = list.map(function (p) {
      var st = C.state(p), isNew = listChanges[p.slug] && !pieces.some(function (x) { return x.slug === p.slug; }), ch = listChanges[p.slug] || (p.slug in stockEdits);
      var nm = esc(p.name || p.slug), s = stockOf(p);
      return '<article class="card' + (ch ? ' changed' : '') + (st === 'archived' || st === 'preview' ? ' off' : '') + (openCard === p.slug ? ' open' : '') + '" data-slug="' + esc(p.slug) + '">'
        + (reorder || isNew ? '<div class="ph" style="cursor:default">' : '<button type="button" class="ph" data-act="edit" aria-label="Ouvrir la fiche ' + nm + '">') + thumb((p.images || [])[0]) + '<span class="badges">' + badges(p, st) + (isNew ? '<span class="vg-pill todo">Copie à enregistrer</span>' : '') + '</span>' + (reorder || isNew ? '</div>' : '</button>')
        + '<div class="meta"><b>' + nm + '</b><span>' + eur(p.price) + ' · Stock ' + s + '</span></div>'
        + (reorder
          ? (st === 'archived' ? '' : '<div class="reorder"><button type="button" class="mini" data-act="up" aria-label="Avancer ' + nm + '">◀</button><button type="button" class="mini" data-act="down" aria-label="Reculer ' + nm + '">▶</button></div>')
          : '<div class="row"><span class="step"><button type="button" data-act="minus" aria-label="Stock moins un">−</button><output>' + s + '</output><button type="button" data-act="plus" aria-label="Stock plus un">+</button></span><button type="button" class="mini" data-act="menu" aria-label="Actions pour ' + nm + '" aria-expanded="' + (openCard === p.slug) + '">⋯</button></div>'
            + '<div class="acts">'
            + (isNew ? '' : '<button type="button" class="vg-btn ghost" data-act="edit">Ouvrir la fiche</button>' + (st === 'preview' ? '' : '<a class="vg-btn ghost" target="_blank" rel="noopener" href="../product/' + encodeURIComponent(p.slug) + '">Voir sur le site ↗</a>') + (st === 'preview' || st === 'scheduled' ? '<a class="vg-btn ghost" target="_blank" rel="noopener" href="apercu/' + encodeURIComponent(p.slug) + '/">Aperçu</a>' : ''))
            + '<button type="button" class="vg-btn ghost" data-act="dup">Dupliquer</button>'
            + (st === 'preview' || st === 'scheduled' ? '<button type="button" class="vg-btn ghost" data-act="publish">Publier maintenant</button>' : '')
            + (st === 'scheduled' ? '<button type="button" class="vg-btn ghost" data-act="unschedule">Annuler la programmation</button>' : '')
            + (st === 'live' ? '<button type="button" class="vg-btn ghost" data-act="coming">Marquer « bientôt disponible »</button>' : '')
            + (st === 'coming' ? '<button type="button" class="vg-btn ghost" data-act="open">Ouvrir à la vente</button>' : '')
            + (st === 'live' || st === 'coming' ? '<button type="button" class="vg-btn ghost" data-act="hide">Passer en aperçu (masquer)</button>' : '')
            + (st === 'archived' ? '<button type="button" class="vg-btn ghost" data-act="restore">Remettre en ligne</button>' : '<button type="button" class="vg-btn ghost" data-act="archive">Archiver (retirer du site)</button>')
            + '</div>')
        + '</article>';
    }).join('') || '<div class="empty vg-muted">Aucune pièce ici.</div>';
    var n = Object.keys(listChanges).length + Object.keys(stockEdits).length;
    $('bar-list').hidden = !n || !!cur; $('bar-list-t').textContent = n + ' changement' + (n > 1 ? 's' : '') + ' à enregistrer';
  }

  $('chips').addEventListener('click', function (e) { var f = e.target.getAttribute('data-f'); if (f) { filter = f; drawList(); } });
  $('alert-w-b').addEventListener('click', function () { filter = 'noweight'; drawList(); window.scrollTo(0, 0); });
  $('filter').addEventListener('input', drawList);
  $('reorder').addEventListener('click', function () { reorder = !reorder; openCard = null; drawList(); });
  $('refresh').addEventListener('click', function () { if ((!Object.keys(listChanges).length && !Object.keys(stockEdits).length) || confirm('Abandonner les changements non enregistrés ?')) load(); });

  function applyChanges(map) { Object.keys(map).forEach(function (s) { listChanges[s] = map[s]; }); drawList(); }
  $('grid').addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var card = el.closest('.card'), act = el.getAttribute('data-act'), slug = card.getAttribute('data-slug');
    var all = merged(), p = byslug(slug), one = {};
    if (act === 'edit') { location.hash = '#/p/' + encodeURIComponent(slug); return; }
    if (act === 'menu') { openCard = openCard === slug ? null : slug; return drawList(); }
    if (act === 'minus' || act === 'plus') {
      var n = Math.max(0, stockOf(p) + (act === 'plus' ? 1 : -1)), orig = stock && stock[slug] ? stock[slug].stock : (isFinite(Number(p.quantity)) ? Number(p.quantity) : 1);
      if (n === orig) delete stockEdits[slug]; else stockEdits[slug] = n;
      return drawList();
    }
    if (act === 'up' || act === 'down') return applyChanges(C.move(all, slug, act === 'up' ? -1 : 1));
    if (act === 'dup') {
      var name = window.prompt('Nom de la copie (ex. ' + (p.name || slug) + ' bleu) :', '');
      if (name === null) return;
      var r = C.duplicate(all, slug, name);
      if (r.error) return say(r.error, true);
      one[r.slug] = r.product; openCard = null; applyChanges(one);
      return say('Copie « ' + r.product.name + ' » créée en aperçu. Enregistre, puis ouvre sa fiche pour changer ses photos.');
    }
    if (act === 'unschedule') { var u = Object.assign({}, p); delete u.publish_at; one[slug] = u; }
    if (act === 'publish') { if (!(p.categories || []).length) return say('Cette pièce n\'a aucune catégorie : ouvre sa fiche et ajoutes-en une.', true); one[slug] = C.setHidden(p, false); }
    if (act === 'hide') one[slug] = C.setComing(C.setHidden(p, true), false);
    if (act === 'coming') one[slug] = C.setComing(p, true);
    if (act === 'open') one[slug] = C.setComing(p, false);
    if (act === 'archive') one[slug] = C.setArchived(p, true);
    if (act === 'restore') one[slug] = C.setArchived(p, false);
    openCard = null; applyChanges(one);
  });

  // Programmation : le Worker déclenche la reconstruction du site à l'heure (voir checkout-worker, publishCron).
  function syncSchedule(map) {
    var jobs = [];

      else if (before && before.publish_at) jobs.push({ path: '/admin/schedule/cancel', body: { slug: slug } });
    });

    return workerReady().then(function () {
      return jobs.reduce(function (p, j) { return p.then(function () { return window.vgAdminApi(j.path, { method: 'POST', body: JSON.stringify(j.body) }); }); }, Promise.resolve());
    }).then(function () {

      try {
        await syncSchedule(one);
        if (!isNew && cur.stock !== cur.stockOrig && isFinite(cur.stock)) { var m = {}; m[slug] = cur.stock; await saveStock(m); }
      } catch (e2) { note = ' Attention : ' + e2.message + ' (la fiche est bien enregistrée ; réessaie le stock ou la programmation).'; }
      pieces = pieces.filter(function (p) { return p.slug !== slug; }).concat([saved]); delete listChanges[slug];
      if (stock && isFinite(cur.stock)) { stock[slug] = Object.assign({}, stock[slug] || { held: 0 }, { stock: cur.stock }); }
      dirty = false; lastHash = '#/p/' + encodeURIComponent(slug);
      say('Enregistré. Le site se reconstruit tout seul (1 à 2 min).' + note, !!note);
      if (isNew) location.hash = '#/p/' + encodeURIComponent(slug); else openFiche(slug, false);
    } catch (e) { say('Erreur : ' + e.message, true); err.textContent = e.message; err.hidden = false; }
    btn.disabled = false;
  });

  // ---------- chargement ----------
  function load() {
    say('Chargement des pièces…');
    return Promise.all([
      VGPiecesSave.loadPieces(gh()),
      fetch('categories.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
      fetch('shipping-config.json').then(function (r) { return r.json(); }).catch(function () { return null; }),
      window.vgAdminToken() ? window.vgAdminApi('/admin/stock').then(function (d) { return d.stock || {}; }).catch(function () { return null; }) : Promise.resolve(null)
    ]).then(function (res) {
      pieces = res[0]; categories = res[1]; config = res[2]; stock = res[3]; listChanges = {}; stockEdits = {};
      $('login').hidden = true; $('app').hidden = false; say('');
      if (!stock) say('Stock en direct indisponible (session expirée ?) : le stock affiché est la quantité de départ de chaque fiche.', true);
      route();
    }).catch(function (e) { say('Erreur : ' + e.message, true); });
  }
  $('login-btn').addEventListener('click', function () { VGStudioPublish.login().then(load).catch(function (e) { say(e.message, true); }); });
  if (VGStudioPublish.connected()) load(); // jeton gardé dans l'onglet (sessionStorage) : pas de reconnexion à chaque page
  if (location.hash.indexOf('#/') === 0) say('Connecte-toi avec GitHub pour ouvrir la fiche.');
})();
</script>
</body>
</html>
