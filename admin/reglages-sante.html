<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Santé du site — admin vgthmind</title>
  <style>
    :root { --bg: #f4f2ec; --ink: #171717; --muted: #6b6860; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
    a { color: inherit; }
    h1 { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
    pre { background: rgba(255,255,255,.7); border: 1px solid rgba(0,0,0,.12); border-radius: 12px; padding: 14px; white-space: pre-wrap; word-break: break-word; }
    button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid #171717; background: #171717; color: #fff; cursor: pointer; }
    .muted { color: var(--muted); }
  </style>
<link rel="icon" href="../assets/theme/admin/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="../assets/theme/admin/favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="icon" href="../assets/theme/admin/favicon-16.png?v=3" type="image/png" sizes="16x16">
<link rel="shortcut icon" href="../assets/theme/admin/favicon.ico?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/theme/admin/apple-touch-icon.png?v=3">
</head>
<body>
<main>
  <nav class="vg-back"><a href="reglages.html">← Réglages</a></nav>
  <h1>Santé du site</h1>
  <p class="muted">Clés posées, mode (test ou live), stock, dernière sauvegarde. Visible seulement une fois connecté.</p>
  <pre id="out">Connexion requise.</pre>
  <p class="muted" id="tests"></p>
  <p><button type="button" id="login" hidden>Se connecter avec GitHub</button> <button type="button" id="refresh">Actualiser</button></p>
</main>
<script src="vg-admin-auth.js"></script>
<script src="vg-admin-ui.js"></script>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out');
  function load() {
    if (!window.vgAdminToken()) { out.textContent = 'Connexion requise.'; document.getElementById('login').hidden = false; return; }
    document.getElementById('login').hidden = true;
    fetch(window.VG_ENDPOINT + '/status', { headers: { Authorization: 'Bearer ' + window.vgAdminToken() } })
      .then(function (r) { return r.text().then(function (t) { out.textContent = r.ok ? t : 'Refusé (' + r.status + ').'; }); })
      .catch(function () { out.textContent = 'Le Worker ne répond pas.'; });
  }
  // Lecture seule : données de test encore présentes (le ménage se fait avant la bascule, voir chantier/CHECKLIST-BASCULE.md, phase 2).
  function tests() {
    if (!window.vgAdminToken()) return;
    Promise.all([window.vgAdminApi('/orders').catch(function () { return null; }), window.vgAdminApi('/admin/requests').catch(function () { return null; })]).then(function (r) {
      if (!r[0] && !r[1]) return;
      var o = r[0] ? (r[0].orders || []).filter(function (x) { return x.livemode === false; }).length : '?', q = r[1] ? (r[1].requests || []).length : '?';
      document.getElementById('tests').textContent = q + ' demande' + (q > 1 ? 's' : '') + ' et ' + o + ' commande' + (o > 1 ? 's' : '') + ' de test présente' + ((q > 1 || o > 1) ? 's' : '') + '. Le ménage se fait avant le lancement (chantier/CHECKLIST-BASCULE.md, phase 2) ; après le lancement, une demande ou commande réelle ne doit plus être comptée ici comme test.';
    });
  }
  document.getElementById('refresh').addEventListener('click', function () { load(); tests(); });
  document.getElementById('login').addEventListener('click', function () { window.vgAdminLogin().then(load).catch(function (e) { out.textContent = e.message; }); });
  load(); tests();
})();
</script>
<script src="vg-admin-cursor.js"></script>
</body>
</html>
