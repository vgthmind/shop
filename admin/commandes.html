<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>vgthmind — commandes</title>
  <style>
    :root { --bg: #f4f2ec; --ink: #171717; --muted: #6b6860; --line: rgba(0,0,0,.12); --card: rgba(255,255,255,.6); --ok: #2f7d4a; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 4px; }
    nav a { color: var(--muted); font-size: 13px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
    input[type=password], input[type=text] { flex: 1 1 260px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; }
    button, .btn { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
    button:hover, .btn:hover { border-color: var(--ink); }
    .filters button[aria-pressed=true] { background: var(--ink); color: #fff; }
    .order { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
    .order header { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .order .total { font-weight: 600; }
    .muted { color: var(--muted); font-size: 13px; }
    .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
    .tag.ok { color: var(--ok); border-color: var(--ok); }
    .tag.ref { font-weight: 700; letter-spacing: .04em; color: var(--ink); border-color: var(--ink); }
    .tag.prep { color: #8a5a00; border-color: #8a5a00; }
    .tag.trk-problem { color: #fff; background: #b3261e; border-color: #b3261e; font-weight: 700; }
    .tag.trk-pickup { color: #8a5a00; border-color: #8a5a00; }
    .tag.test { color: #8a5a00; border-color: #8a5a00; }
    .tag.refunded { color: #fff; background: #b3261e; border-color: #b3261e; font-weight: 700; }
    .order.is-refunded { border-left: 5px solid #b3261e; }
    ul { margin: 8px 0; padding-left: 18px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    #msg { min-height: 1.4em; }
    .items { list-style: none; padding: 0; margin: 10px 0; }
    .items li { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
    .items li:first-child { border-top: 0; }
    .items img, .items .ph { width: 56px; height: 59px; object-fit: contain; border-radius: 6px; background: var(--bg); flex: none; }
    .items .nm { flex: 1; min-width: 0; }
    .items .nm small { display: block; color: var(--muted); }
    .items .pr { white-space: nowrap; }
    .filters button { font-family: var(--f-mono, ui-monospace, monospace); font-size: 12px; letter-spacing: .03em; min-height: 40px; }
    .filters button[aria-pressed=true] { background: var(--chrome, #e4e4e8); color: var(--ink); border-color: rgba(0,0,0,.28); box-shadow: 0 1px 0 #fff inset, 0 1px 3px rgba(0,0,0,.18); }
    .order.ord { padding: 0; overflow: hidden; border-left: 5px solid var(--st-todo, #c9741a); }
    .order.ord.sent { border-left-color: var(--st-done, #2f7d4a); }
    .order.ord.ref { border-left-color: #b3261e; }
    .order.ord.prep { border-left-color: var(--st-plan, #2c5f9e); }
    .sum { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
    .sum:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
    .sum .th { width: 64px; height: 70px; object-fit: contain; border-radius: 8px; background: var(--bg); }
    .sum .who small { display: block; color: var(--muted); font-size: 13px; }
    .sum .amt { text-align: right; white-space: nowrap; }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font: 500 11px/1.2 var(--f-mono, ui-monospace, monospace); letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--st-todo, #c9741a); margin-top: 4px; }
    .pill.sent { background: var(--st-done, #2f7d4a); } .pill.ref { background: #b3261e; } .pill.prep { background: var(--st-plan, #2c5f9e); }
    .pill.ref0 { background: transparent; color: var(--ink); border: 1px solid var(--ink); margin: 0 4px 0 0; }
    .drawer { padding: 4px 16px 14px; border-top: 1px solid var(--line); background: rgba(255,255,255,.55); }
    .actions button[data-ship] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .actions button[data-refund] { color: #b3261e; border-color: rgba(179,38,30,.4); }
    @media (max-width: 520px) { .sum { grid-template-columns: 52px 1fr auto; gap: 10px; } .sum .th { width: 52px; height: 58px; } }
  </style>
<link rel="icon" href="../assets/theme/admin/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="../assets/theme/admin/favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="icon" href="../assets/theme/admin/favicon-16.png?v=3" type="image/png" sizes="16x16">
<link rel="shortcut icon" href="../assets/theme/admin/favicon.ico?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/theme/admin/apple-touch-icon.png?v=3">
</head>
<body>
<main>
  <div class="vg-head"><div><h1>Commandes</h1><p class="vg-sub">Paiements reçus via Stripe (100 derniers).</p></div></div>

  <div class="bar" id="login" hidden>
    <button type="button" id="login-btn">Se connecter avec GitHub</button>
  </div>

  <div class="bar filters" id="filters" hidden>
    <button type="button" data-f="todo" aria-pressed="true">À expédier</button>
    <button type="button" data-f="done" aria-pressed="false">Expédiées</button>
    <button type="button" data-f="refunded" aria-pressed="false">Remboursées</button>
    <button type="button" data-f="deposit" aria-pressed="false">Acomptes</button>
    <button type="button" data-f="all" aria-pressed="false">Toutes</button>
    <input type="text" id="q" placeholder="Rechercher : VG-…, nom, e-mail" aria-label="Rechercher une commande" autocomplete="off">
    <button type="button" id="refresh">Actualiser</button>
  </div>

  <p id="msg" role="status" aria-live="polite"></p>
  <div id="orders"></div>
</main>
<script src="vg-admin-auth.js"></script>
<script src="vg-admin-ui.js"></script>
<script src="../assets/vg-invoice.js"></script>
<script>
(function () {
  'use strict';
  var orders = [];
  var filter = 'todo';
  var openId = null;
  var $ = function (id) { return document.getElementById(id); };
  var token = window.vgAdminToken;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return (Math.round((n || 0) * 100) / 100).toFixed(2).replace('.', ',') + ' €'; }
  function date(ts) { return new Date(ts * 1000).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }); }
  function countryName(c) {
    if (!c) return '';
    try { return new Intl.DisplayNames(['fr'], { type: 'region' }).of(String(c).toUpperCase()) || c; } catch (e) { return c; }
  }
  function addressLines(a) {
    if (!a) return [];
    return [a.line1, a.line2, [a.postal_code, a.city].filter(Boolean).join(' '), a.state, countryName(a.country)].filter(Boolean);
  }
  function address(a) { return addressLines(a).map(esc).join('<br>'); }

  var api = window.vgAdminApi;

  function load() {
    if (!token()) { $('login').hidden = false; $('filters').hidden = true; return; }
    $('msg').textContent = 'Chargement…';
    api('/orders').then(function (d) {
      orders = d.orders || [];
      $('login').hidden = true;
      $('filters').hidden = false;
      $('msg').textContent = '';
      draw();
    }).catch(function (e) {
      if (e.status === 401) {
        $('login').hidden = false;
        $('msg').textContent = 'Connexion expirée ou refusée : reconnecte-toi (compte GitHub vgthmind).';
      } else {
        $('msg').textContent = 'Erreur : ' + e.message;
      }
    });
  }

  function counts() {
    var real = orders.filter(function (o) { return o.kind !== 'deposit'; });
    var todo = real.filter(function (o) { return !o.shipped && !(o.refunded && o.refunded.full); }).length, ref = real.filter(function (o) { return !!o.refunded; }).length;
    document.querySelector('[data-f="todo"]').textContent = 'À expédier' + (todo ? ' (' + todo + ')' : '');
    document.querySelector('[data-f="refunded"]').textContent = 'Remboursées' + (ref ? ' (' + ref + ')' : '');
  }
  function draw() {
    counts();
    var needle = (($('q') && $('q').value) || '').trim().toLowerCase().replace(/^vg[\s-]*/, '');
    var list = orders.filter(function (o) {
      if (needle && [o.ref, o.name, o.email].join(' ').toLowerCase().replace(/vg-/g, '').indexOf(needle) === -1) return false;
      var rfd = !!(o.refunded && o.refunded.full);
      if (filter === 'all' || needle) return true;
      if (filter === 'refunded') return !!o.refunded;
      if (filter === 'deposit') return o.kind === 'deposit';
      if (o.kind === 'deposit') return false; // un acompte n'a rien à expédier : visible dans « Acomptes », « Remboursées » et « Toutes »
      return filter === 'todo' ? (!o.shipped && !rfd) : !!o.shipped;
    });
    $('orders').innerHTML = list.length ? list.map(function (o) {
      var dep = o.kind === 'deposit', rfd = !!(o.refunded && o.refunded.full), st = rfd ? ['ref', 'Remboursée'] : o.refunded ? ['ref', 'Remboursée en partie'] : dep ? ['sent', 'Acompte payé'] : o.shipped ? ['sent', 'Expédiée'] : o.preparing ? ['prep', 'En préparation'] : ['', 'À expédier'];
      var first = o.items[0] || {}, isOpen = openId === o.id;
      return '<article class="order ord ' + st[0] + (o.refunded ? ' is-refunded' : '') + (isOpen ? ' open' : '') + '" data-id="' + esc(o.id) + '">'
        + '<div class="sum" role="button" tabindex="0" aria-expanded="' + isOpen + '">' + (first.image ? '<img class="th" src="' + esc(first.image) + '" alt="" loading="lazy">' : '<span class="th"></span>')
        + '<div class="who"><b>' + esc(o.name || o.email) + '</b> <span class="pill ref0">' + esc(o.ref || '') + '</span>' + (o.request ? '<span class="pill ref0">Demande ' + esc(o.request) + '</span>' : '') + (o.livemode ? '' : '<span class="pill ref0">test</span>') + (o.name_incomplete ? '<span class="pill ref">Nom incomplet</span>' : '') + '<small>' + esc(first.name || '') + (o.items.length > 1 ? ' +' + (o.items.length - 1) : '') + ' · ' + esc(date(o.created)) + ' · ' + esc(countryName(o.address && o.address.country)) + '</small></div>'
        + '<div class="amt"><b>' + money(o.total) + '</b><br><span class="pill ' + st[0] + '">' + st[1] + '</span></div></div>'
        + '<div class="drawer"' + (isOpen ? '' : ' hidden') + '>'
        + '<header><div>'
        + (o.livemode ? '' : '<span class="tag test">test</span> ')
        + (o.name_incomplete ? '<span class="tag refunded">⚠ Nom incomplet : demander nom et prénom au client avant l’envoi</span> ' : '')
        + (o.invoice_no ? '<span class="tag">facturée ' + esc(o.invoice_no) + '</span> ' : '')
        + (o.refunded ? '<span class="tag refunded">' + (o.refunded.full ? 'Remboursée' : 'Remboursée en partie') + ' · ' + esc(String(o.refunded.amount).replace('.', ',')) + ' €</span> ' : '')
        + (o.preparing && !o.shipped ? '<span class="tag prep">en préparation depuis le ' + esc(date(o.preparing.at)) + '</span> ' : '')
        + (o.shipped ? '<span class="tag ok">expédiée le ' + esc(date(o.shipped.at)) + (o.shipped.tracking ? ' · suivi ' + esc(o.shipped.tracking) : '') + (o.shipped.notified ? ' · client prévenu' : '') + '</span>' : '')
        + (o.shipped && o.shipped.track ? ' <span class="tag trk-' + esc(o.shipped.track.state) + (o.shipped.track.state === 'delivered' ? ' ok' : '') + '" title="' + esc(o.shipped.track.label || '') + '">' + esc({ transit: 'En transit', pickup: 'En point retrait', delivered: 'Livrée', problem: 'Problème' }[o.shipped.track.state] || '') + (o.shipped.track.label ? ' · ' + esc(o.shipped.track.label) : '') + '</span>' : (o.shipped && o.shipped.tracking ? ' <span class="tag">statut : en attente de La Poste</span>' : ''))
        + '<div class="muted">' + esc(date(o.created)) + ' · ' + esc(o.email) + (o.phone ? ' · ' + esc(o.phone) : '') + '</div></div>'
        + '</header>'
        + '<ul class="items">' + o.items.map(function (it) {
          return '<li>' + (it.image ? '<img src="' + esc(it.image) + '" alt="' + esc(it.name) + '" width="56" height="59" loading="lazy">' : '<span class="ph"></span>')
            + '<span class="nm"><strong>' + esc(it.name) + '</strong><small>' + (it.size ? 'Taille ' + esc(it.size) + ' · ' : '') + 'Qté ' + esc(it.qty || 1) + (it.unit ? ' (' + money(it.unit) + ' l\'unité)' : '') + '</small></span>'
            + '<span class="pr">' + money(it.amount) + '</span></li>';
        }).join('')
        + '<li class="muted"><span class="ph" style="visibility:hidden"></span><span class="nm">Livraison' + (o.discount ? ' · remise −' + money(o.discount) : '') + '</span><span class="pr">' + money(o.shipping) + '</span></li></ul>'
        + '<div class="muted">' + address(o.address) + '</div>'
        + '<div class="actions">'
        + (dep ? '' : o.shipped
          ? '<button type="button" class="primary" data-mail>' + (o.shipped.notified ? 'Renvoyer le mail « expédiée »' : 'Envoyer le mail « expédiée » au client') + '</button><button type="button" data-undo>Annuler « expédiée »</button>'
          : (o.preparing
            ? '<button type="button" data-unprep>Annuler « en préparation »</button>'
            : '<button type="button" data-prep>Marquer en préparation</button>')
            + '<button type="button" class="primary" data-ship>Marquer expédiée…</button>')
        + (dep ? '' : '<button type="button" data-print>Bon de commande</button>')
        + '<button type="button" data-invoice>Facture' + (o.invoice_no ? ' ' + esc(o.invoice_no) : '') + '</button>'
        + (o.refunded ? '<button type="button" data-credit>Voir l’avoir</button>' : '')
        + (o.refunded && o.refunded.full ? '' : '<button type="button" data-refund>Rembourser…</button>')
        + '<a class="btn" target="_blank" rel="noopener" href="https://dashboard.stripe.com/' + (o.livemode ? '' : 'test/') + 'checkout/sessions/' + esc(o.id) + '">Voir dans Stripe</a>'
        + '</div></div></article>';
    }).join('') : '<p class="muted">Aucune commande ici.</p>';
  }

  $('orders').addEventListener('click', function (e) {
    var card = e.target.closest('.order');
    if (!card) return;
    var o = orders.filter(function (x) { return x.id === card.getAttribute('data-id'); })[0];
    if (e.target.closest('.sum')) { openId = openId === o.id ? null : o.id; draw(); return; }
    if (e.target.hasAttribute('data-prep') || e.target.hasAttribute('data-unprep')) {
      var undoPrep = e.target.hasAttribute('data-unprep');
      api('/orders/preparing', { method: 'POST', body: JSON.stringify(undoPrep ? { id: o.id, undo: true } : { id: o.id }) })
        .then(function (d) {
          o.preparing = undoPrep ? null : d.preparing;
          draw();
          $('msg').textContent = undoPrep ? '« En préparation » annulé.' : 'Marquée en préparation : le client la voit sur la page de suivi.';
        })
        .catch(function (err) { $('msg').textContent = 'Erreur : ' + err.message; });
    }
    if (e.target.hasAttribute('data-refund')) {
      var amt = window.prompt('Rembourser « ' + (o.ref || o.name || o.email) + ' » (' + money(o.total) + ')\n\nMontant en € à rembourser (laisse vide pour rembourser tout ce qui reste) :', '');
      if (amt === null) return;
      amt = amt.trim();
      if (!window.confirm('Confirmer le remboursement ' + (amt ? amt + ' €' : 'total') + (o.livemode ? ' (VRAIE commande : l\'argent repart chez le client)' : ' (commande de test)') + ' ?')) return;
      $('msg').textContent = 'Remboursement en cours…';
      api('/orders/refund', { method: 'POST', body: JSON.stringify({ id: o.id, amount: amt }) })
        .then(function (d) {
          o.refunded = { amount: d.total != null ? d.total : d.amount, full: d.full !== false };
          draw();
          $('msg').textContent = d.already ? 'Cette commande était déjà remboursée chez Stripe : elle est maintenant à jour ici (bouton « Voir l’avoir »).' : 'Remboursé : ' + String(d.amount).replace('.', ',') + ' €. La commande est marquée « Remboursée » ; le bouton « Voir l’avoir » est disponible.';
        })
        .catch(function (err) { $('msg').textContent = 'Erreur : ' + err.message; });
    }
    if (e.target.hasAttribute('data-ship')) {
      var tracking = window.prompt('Numéro de suivi (celui de ton étiquette ; vide s\'il n\'y en a pas) :', '');
      if (tracking === null) return;
      api('/orders/shipped', { method: 'POST', body: JSON.stringify({ id: o.id, tracking: tracking.trim() }) })
        .then(function (d) {
          o.shipped = d.shipped;
          draw();
          if (!o.shipped.tracking && !window.confirm('Pas de numéro de suivi : envoyer quand même le mail « ta commande est partie » à ' + o.email + ' ?')) {
            $('msg').textContent = 'Marquée expédiée. Le client n\'est pas prévenu (clique « Envoyer le mail » quand tu veux).';
            return;
          }
          $('msg').textContent = 'Marquée expédiée, envoi du mail au client…';
          return api('/orders/shipped-mail', { method: 'POST', body: JSON.stringify({ id: o.id }) }).then(function (m) {
            o.shipped = m.shipped; draw(); $('msg').textContent = 'Expédiée : le mail avec le lien de suivi est parti vers ' + o.email + '.';
          });
        })
        .catch(function (err) { $('msg').textContent = 'Erreur : ' + err.message; });
    }
    if (e.target.hasAttribute('data-mail')) {
      var again = !!o.shipped.notified;
      var trk = (o.shipped.tracking || '').trim();
      if (!trk) {
        // Sans numéro, le mail n'a pas de ligne « Numéro de suivi » : on propose de le saisir maintenant.
        trk = window.prompt('Cette commande n\'a pas de numéro de suivi : le mail partirait sans. Saisis-le ici (vide = envoyer sans suivi) :', '');
        if (trk === null) return;
        trk = trk.trim();
      }
      if (!window.confirm((again ? 'Renvoyer' : 'Envoyer') + ' le mail « expédiée » à ' + o.email + (trk ? ' avec le suivi ' + trk : ' sans numéro de suivi') + ' ?')) return;
      $('msg').textContent = 'Envoi…';
      api('/orders/shipped-mail', { method: 'POST', body: JSON.stringify({ id: o.id, tracking: trk }) })
        .then(function (d) { o.shipped = d.shipped; draw(); $('msg').textContent = 'Mail envoyé à ' + o.email + '.'; })
        .catch(function (err) { $('msg').textContent = 'Erreur : ' + err.message; });
    }
    if (e.target.hasAttribute('data-credit')) {
      window.VGInvoice.openAsync(api('/admin/invoice?id=' + encodeURIComponent(o.id)).then(function (d) { return d.invoice; }), 'fr', 'credit');
      return;
    }
    if (e.target.hasAttribute('data-invoice')) {
      window.VGInvoice.openAsync(api('/admin/invoice?id=' + encodeURIComponent(o.id)).then(function (d) { return d.invoice; }), 'fr');
      return;
    }
    if (e.target.hasAttribute('data-print')) { printSheet(o); return; }
    if (e.target.hasAttribute('data-undo')) {
      api('/orders/shipped', { method: 'POST', body: JSON.stringify({ id: o.id, undo: true }) })
        .then(function () { o.shipped = null; draw(); })
        .catch(function (err) { $('msg').textContent = 'Erreur : ' + err.message; });
    }
  });

  // Bon de commande / étiquette de préparation : une page à imprimer.
  function printSheet(o) {
    var w = window.open('', '_blank');
    if (!w) { window.alert('Fenêtre bloquée : autorise les pop-ups pour ce site.'); return; }
    var lines = o.items.map(function (it) { return '<tr><td>' + esc(it.name) + (it.size ? ' — taille ' + esc(it.size) : '') + '</td><td class="n">× ' + esc(it.qty || 1) + '</td></tr>'; }).join('');
    w.document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bon ' + esc(o.ref) + '</title><style>body{font:15px/1.5 system-ui,sans-serif;max-width:520px;margin:16px auto;padding:0 12px}h1{font-size:20px;margin:0}.dest{font-size:20px;line-height:1.35;border:2px solid #000;padding:12px;margin:14px 0}table{width:100%;border-collapse:collapse}td{padding:6px 2px;border-bottom:1px solid #ccc}.n{text-align:right}small{color:#555}button{margin:0 8px 12px 0;min-height:44px;padding:8px 18px;border-radius:999px;border:1px solid #171717;background:#171717;color:#fff;font:500 12px/1.25 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}@media(pointer:coarse){#vg-print{display:none}}@media print{button{display:none}}</style>'
      + '<button id="vg-print" type="button">Imprimer</button> <button id="vg-share" type="button">Partager / Enregistrer le PDF</button><h1>vgthmind — ' + esc(o.ref) + (o.livemode ? '' : ' (TEST)') + '</h1><small>' + esc(date(o.created)) + ' · ' + money(o.total) + ' dont port ' + money(o.shipping) + '</small>'
      + '<div class="dest"><strong>' + esc(o.name) + '</strong><br>' + address(o.address) + '</div>'
      + '<table>' + lines + '</table><p><small>' + esc(o.email) + (o.phone ? ' · ' + esc(o.phone) : '') + (o.shipped && o.shipped.tracking ? '<br>Suivi : ' + esc(o.shipped.tracking) : '') + '</small></p>');
    w.document.close();
    window.VGInvoice.addBack(w);
    var pb =w.document.getElementById('vg-print');
    if (pb) pb.addEventListener('click', function () { w.focus(); w.print(); });
    var sb = w.document.getElementById('vg-share');
    if (sb) sb.addEventListener('click', function () {
      window.VGInvoice.sharePdf(w, function () {
        return window.VGInvoice.sheetPdf({
          title: 'vgthmind — ' + o.ref + (o.livemode ? '' : ' (TEST)'), sub: date(o.created) + ' · ' + money(o.total) + ' dont port ' + money(o.shipping),
          dest: [o.name].concat(addressLines(o.address)),
          items: o.items.map(function (it) { return [it.name + (it.size ? ' — taille ' + it.size : ''), '× ' + (it.qty || 1)]; }),
          foot: [[o.email, o.phone].filter(Boolean).join(' · ')].concat(o.shipped && o.shipped.tracking ? ['Suivi : ' + o.shipped.tracking] : [])
        });
      }, 'bon-' + o.ref + '.pdf');
    });
  }

  $('orders').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sum')) { e.preventDefault(); e.target.click(); }
  });
  $('q').addEventListener('input', draw);

  $('filters').addEventListener('click', function (e) {
    var f = e.target.getAttribute('data-f');
    if (!f) return;
    filter = f;
    document.querySelectorAll('[data-f]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === e.target)); });
    draw();
  });
  $('refresh').addEventListener('click', load);
  $('login-btn').addEventListener('click', function () {
    window.vgAdminLogin().then(load).catch(function (e) { $('msg').textContent = e.message; });
  });

  load();
})();
</script>
<script src="vg-admin-cursor.js"></script>
</body>
</html>
