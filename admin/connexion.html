<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion | vgthmind</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f2ec; color: #171717; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { text-align: center; padding: 24px 16px; max-width: 360px; }
    button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 1px solid #171717; background: #171717; color: #fff; cursor: pointer; }
    p { color: #6b6860; }
  </style>
<link rel="icon" href="../assets/theme/admin/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="../assets/theme/admin/favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="icon" href="../assets/theme/admin/favicon-16.png?v=3" type="image/png" sizes="16x16">
<link rel="shortcut icon" href="../assets/theme/admin/favicon.ico?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/theme/admin/apple-touch-icon.png?v=3">
</head>
<body>
<main>
  <h1 style="font-size:18px;letter-spacing:.1em;text-transform:uppercase">Admin vgthmind</h1>
  <p>Connexion requise.</p>
  <button type="button" id="login">Se connecter avec GitHub</button>
  <p id="msg" role="status" aria-live="polite"></p>
</main>
<script src="vg-admin-auth.js"></script>
<script>
(function () {
  'use strict';
  var msg = document.getElementById('msg');
  // Garde-fou : jamais plus de 3 allers-retours connexion <-> page admin en 30 s (session refusée mais gardée ici = boucle).
  function tooMany() {
    try {
      var h = JSON.parse(sessionStorage.getItem('vg-go') || '[]').filter(function (t) { return Date.now() - t < 30000; });
      h.push(Date.now()); sessionStorage.setItem('vg-go', JSON.stringify(h));
      return h.length > 3;
    } catch (e) { return false; }
  }
  function go() {
    if (tooMany()) { window.vgAdminLogout(); msg.textContent = 'La session est refusée par le serveur : clique sur « Se connecter avec GitHub » pour en ouvrir une nouvelle.'; return; }
    var next = (location.search.match(/[?&]next=([^&]+)/) || [])[1];
    next = next ? decodeURIComponent(next) : '/admin/menu';
    if (next.charAt(0) !== '/' || next.indexOf('//') === 0 || !/^\/admin\//.test(next)) next = '/admin/menu';
    location.replace(next);
  }
  // Une session gardée dans ce navigateur n'est suivie qu'une fois VÉRIFIÉE par le serveur : si elle a été fermée ailleurs
  // (déconnexion, expiration), on l'oublie et on propose de se reconnecter au lieu de repartir vers la page admin.
  // Connexion GitHub déjà lancée (page rechargée ou recréée pendant la connexion, iPhone) : on reprend l'attente de la session.
  var resumed = window.vgAdminResumeLogin();
  // Page ouverte par la fenêtre GitHub une fois connecté (iPhone, appli installée : fenêtre séparée de l'appli, sans session ici).
  // Rien à faire ici : surtout pas de bouton « Se connecter » (c'était la boucle) ; l'appli récupère la session toute seule.
  if (!resumed && /[?&]done=1/.test(location.search) && !window.vgAdminToken()) {
    document.getElementById('login').style.display = 'none';
    document.querySelector('main p').textContent = 'Connecté ✓';
    msg.textContent = 'Tu peux fermer cette fenêtre et revenir dans l\'appli : elle se connecte toute seule.';
    try { window.close(); } catch (e) {}
    return;
  }
  if (resumed) {
    msg.textContent = 'Connexion en cours…';
    resumed.then(function () { try { sessionStorage.removeItem('vg-go'); } catch (e) {} go(); }).catch(function (e) { msg.textContent = e.message; });
  }
  var tok = resumed ? '' : window.vgAdminToken();
  if (tok) {
    msg.textContent = 'Vérification de ta session…';
    fetch(window.VG_ENDPOINT + '/admin/renew', { method: 'POST', headers: { Authorization: 'Bearer ' + tok } })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); msg.textContent = ''; go(); })
      .catch(function () { window.vgAdminLogout(); msg.textContent = 'Ta session est terminée : reconnecte-toi avec GitHub.'; });
  }
  document.getElementById('login').addEventListener('click', function () {
    msg.textContent = '';
    window.vgAdminLogin().then(function () { try { sessionStorage.removeItem('vg-go'); } catch (e) {} go(); }).catch(function (e) { msg.textContent = e.message; });
  });
})();
</script>
</body>
</html>
