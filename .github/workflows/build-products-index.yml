name: Build products index

on:
  push:
    branches: [main]
    paths:
      - "data/products/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/products.json from individual product files
        run: |
          node -e "
          const fs = require('fs');
          const dir = 'data/products';
          const files = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter(f => f.endsWith('.json'))
            : [];
          const products = files
            .map(f => JSON.parse(fs.readFileSync(dir + '/' + f, 'utf8')))
            .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          fs.writeFileSync('data/products.json', JSON.stringify(products, null, 2) + '\n');
          console.log('Built data/products.json with', products.length, 'products');
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git diff --staged --quiet || git commit -m "Regenere data/products.json"
          git push
