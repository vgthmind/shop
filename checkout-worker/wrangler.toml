name = "vgthmind-shop-checkout"
main = "index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Pas d'account_id ici : wrangler prend le compte de `wrangler login`.
# Aucun secret dans ce fichier (npx.cmd wrangler secret put …) :
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GITHUB_CLIENT_SECRET,
#   RESEND_API_KEY, ALERT_EMAIL (adresse perso : jamais dans le depot)
# Emails client : variable MAIL_FROM (domaine verifie dans Resend), vide = alerte seule.
[vars]
# Sites autorisés (séparés par des virgules) : ancien aperçu, Cloudflare Pages, domaine.
ALLOWED_ORIGIN = "https://vgthmind-shop.pages.dev,https://vgthmind.org,https://www.vgthmind.org,https://vgthmind.github.io"
SITE_BASE = "https://www.vgthmind.org"
# Où le Worker lit le catalogue (products.json) et la grille d'envoi : le site Cloudflare Pages (plus l'aperçu GitHub, arrêté).
CATALOG_BASE = "https://vgthmind-shop.pages.dev"
# "1" seulement le jour du passage en live (voir README) : tant que c'est "0",
# toute cle sk_live_ est refusee.
LIVE_MODE = "1"
ADMIN_GITHUB_LOGIN = "vgthmind"
# Expediteur des emails (domaine verifie dans Resend). Public, pas un secret.
MAIL_FROM = "vgthmind <commande@vgthmind.org>"
# Identifiant (public) de l'OAuth App GitHub de l'admin ; son secret est un
# secret Cloudflare (GITHUB_CLIENT_SECRET).
# Adresse de l'émetteur des factures : saisie dans l'admin (Réglages > Facturation), jamais dans ce fichier.
GITHUB_CLIENT_ID = "Ov23liAh57fi8Xa7RNNg"
# Adresse publique de ce Worker (photos de la pièce finie dans les mails « valide ta pièce »).
WORKER_BASE = "https://vgthmind-shop-checkout.vgthm66.workers.dev"

# Commandes expediees, sauvegardes du stock, etats OAuth (identifiant de
# stockage, pas un secret).
[[kv_namespaces]]
binding = "HOLDS"
id = "de2360d770d64089b018c6f56d48bb85"

# Stock + reservations : Durable Object (stockage SQLite, plan gratuit).
[[durable_objects.bindings]]
name = "STOCK"
class_name = "StockDO"

[[durable_objects.bindings]]
name = "TRAFFIC"
class_name = "TrafficDO"

# Pièces sur demande : demandes, statuts, devis, réglages (prix « à partir de », acompte, délais).
[[durable_objects.bindings]]
name = "REQUESTS"
class_name = "RequestsDO"

# Fichiers joints des demandes (photos / vidéos du client, photos de la pièce finie, photos des cartes).
# Bucket privé, juridiction Union européenne (créé par vgthmind le 2026-10-12). Sans lui, le formulaire
# propose seulement un lien (WeTransfer, Drive…).
[[r2_buckets]]
binding = "FILES"
bucket_name = "vgthmind-demandes"
jurisdiction = "eu"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StockDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TrafficDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RequestsDO"]

# Sauvegarde du stock chaque jour a 03:30 UTC (KV backup:<date>, 180 jours) ;
# toutes les heures (:15) : relances, alertes et durées de conservation des demandes.
[triggers]
crons = ["30 3 * * *", "15 * * * *", "* * * * *"]
