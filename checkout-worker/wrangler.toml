name = "vgthmind-shop-checkout"
main = "index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Pas d'account_id ici : wrangler prend le compte de `wrangler login`.
# Aucun secret dans ce fichier : STRIPE_SECRET_KEY se saisit avec
#   npx wrangler secret put STRIPE_SECRET_KEY
[vars]
ALLOWED_ORIGIN = "https://vgthmind.github.io"
SITE_BASE = "https://vgthmind.github.io/shop"
# "1" seulement le jour du passage en live (voir README) : tant que c'est "0",
# toute cle sk_live_ est refusee.
LIVE_MODE = "0"
GITHUB_REPO = "vgthmind/shop"
ADMIN_GITHUB_LOGIN = "vgthmind"

# Reservations des pieces pendant un paiement (30 min) + trace des commandes.
# (identifiant de stockage, pas un secret)
[[kv_namespaces]]
binding = "HOLDS"
id = "de2360d770d64089b018c6f56d48bb85"
