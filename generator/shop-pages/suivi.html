<div class="vg-track" data-vg-track>
<p class="vg-track-lang" aria-label="Language / Langue"><a href="#" data-lang="fr">FR</a> · <a href="#" data-lang="en">EN</a></p>
<div class="vg-track-lookup">
<p class="vg-track-intro" data-t="intro">Enter your order number (in your confirmation email) and the email address used for the order.</p>
<form class="contact-form vg-track-form" novalidate>
<div class="contact-form-block">
<label class="contact-label" for="vg-track-ref" data-t="ref">Order number</label>
<div class="input-holder"><input id="vg-track-ref" type="text" name="ref" placeholder="VG-K7M4QX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14"></div>
</div>
<div class="contact-form-block">
<label class="contact-label" for="vg-track-email" data-t="email">Email</label>
<div class="input-holder"><input id="vg-track-email" type="email" name="email" autocomplete="email" inputmode="email" maxlength="254"></div>
</div>
<div class="contact-form-block">
<button class="button button--checkout vg-track-submit" type="submit" data-t="submit">Track my order</button>
</div>
</form>
<p class="vg-track-msg" role="status" aria-live="polite" hidden></p>
</div>
<div class="vg-track-result" hidden aria-live="polite"></div>
</div>
